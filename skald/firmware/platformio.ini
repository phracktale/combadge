; Configuration PlatformIO — firmware Skald
; Cible : Seeed XIAO ESP32-S3 Sense
;
; Avant le premier flash, confirmer l'identifiant exact de la carte :
;   pio boards xiao
; (l'id attendu est seeed_xiao_esp32s3 ; ajuster si la commande renvoie autre chose)

[env:seeed_xiao_esp32s3]
platform = espressif32
board = seeed_xiao_esp32s3
framework = arduino

; Console série sur l'USB natif de l'ESP32-S3 (sinon pas de sortie Serial)
build_flags = -D ARDUINO_USB_CDC_ON_BOOT=1

monitor_speed = 115200
