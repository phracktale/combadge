; Configuration PlatformIO — firmware Skald
; Cible : Seeed XIAO ESP32-S3 Sense
;
; Avant le premier flash, confirmer l'identifiant exact de la carte :
;   pio boards xiao
; (l'id attendu est seeed_xiao_esp32s3 ; ajuster si la commande renvoie autre chose)

[env:seeed_xiao_esp32s3]
platform = espressif32
board = seeed_xiao_esp32s3
framework = arduino

; Console série sur l'USB natif de l'ESP32-S3 + PSRAM activée (buffer audio).
; Capture audio : API I2S héritée (driver/i2s.h) pour rester compatible avec
; la core arduino-esp32 fournie par défaut par PlatformIO (évite la
; dépendance pioarduino/core 3.x — voir spec §5 risque 1).
build_flags =
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D BOARD_HAS_PSRAM

; XIAO ESP32-S3R8 : PSRAM octale (OPI). À confirmer au build (B1) si erreur PSRAM.
board_build.arduino.memory_type = qio_opi

monitor_speed = 115200
